services:
  postgresdb:
    image: postgres:18
    container_name: postgres_ithome
    restart: always

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5435:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: