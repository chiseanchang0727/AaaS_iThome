agent:
  model: anthropic:claude-sonnet-4-6
  # Resolved against the working directory. Read-only to the agent.
  skills_dir: skills
  # A tool result bigger than this is refused rather than put into the model's
  # context. Approximate: ~4 characters per token.
  max_result_tokens: 5000
  # Classifies each user message against the skills (TypeSafe) and names the
  # relevant ones in the system prompt. Delete the section to turn it off.
  # Needs $TYPESAFE_API_KEY.
  skill_router:
    model: jev-1.13.0
    # At most this many skills per user message.
    top_n: 1
    multi: false
  # Sends only the earlier turns each new message needs; the rest stay in the
  # history file. Used by evals/memory for now, not yet by the API.
  context_filter:
    model: jev-1.13.0
    # An older turn is sent when Jev says yes with at least this probability.
    threshold: 0.5
    # The most recent turns are always sent, without asking Jev.
    keep_last: 1
    # Follow references back through earlier turns, at most this many rounds
    # (one Jev round trip each). 1: only ask about the new message.
    max_rounds: 3

data:
  # Resolved against the working directory. Format follows from the extension.
  path: ../data/youtube_trending_cleaned_us.csv

database:
  # The DSN carries a password, so it comes from $DATABASE_URL, not this file.
  # Stops a query from pulling a whole table into memory. Context size is
  # agent.max_result_tokens' job, not this one's.
  max_rows: 1000
  timeout: 10.0

sandbox:
  # none: no code execution. Otherwise a name in sandboxes.PROVIDERS;
  # daytona needs $DAYTONA_API_KEY. Provider settings go under `options:`.
  provider: daytona

  # Installed in every new sandbox. The agent analyses with polars and charts
  # with plotly (interactive HTML the frontend renders).
  packages:
    - pyarrow
    - polars
    - plotly
    # Queries Parquet files bigger than the sandbox's memory (see SANDBOX_PROMPT).
    - duckdb

  # Paths inside the sandbox. Home directories differ between providers.
  data_dir: /home/daytona/data
  output_dir: /home/daytona/outputs

  export_max_rows: 100000

  # Put on every sandbox. At startup the API deletes sandboxes with these
  # labels that an earlier run of it left behind (a crash). Give each
  # deployment its own env, or they will delete each other's sandboxes.
  labels:
    app: aaas-ithome
    env: dev

server:
  # Relative to backend/. reports/, uploads/ and conversations/ are git-ignored.
  artifacts_dir: reports/artifacts
  uploads_dir: uploads
  # One <thread_id>.jsonl per conversation, one line per message.
  history_dir: conversations
  # Each open conversation keeps a sandbox (billed) until idle this long.
  sandbox_idle_minutes: 15
  # At most this many sandboxes at once. When all are taken, a new
  # conversation waits this long for one to be freed, then is refused.
  max_sandboxes: 10
  sandbox_wait_seconds: 30
  # Each account is guaranteed a sandbox (one is reclaimed from an account
  # holding several if all are taken), and holds at most this many.
  max_sandboxes_per_account: 3
  # All sandboxes together may use this much memory: the Daytona account's
  # limit (its tier). Sandboxes are 1 GB by default.
  max_memory_gb: 10
  # A command that runs out of memory is run again in a sandbox this big (the
  # work folder is copied over). Delete to turn off.
  bigger_sandbox:
    memory_gb: 4
    cpu: 2
  # Requests without an X-Account header belong to this account (no login yet).
  default_account: test_user
  # Kept started and ready, so a new conversation skips the ~12s start. They
  # count toward max_sandboxes and are billed while they wait. 0: off.
  warm_sandboxes: 1
  max_upload_mb: 50
