agent:
  model: anthropic:claude-sonnet-4-6
  # Resolved against the working directory. Read-only to the agent.
  skills_dir: skills
  # A tool result bigger than this is refused rather than put into the model's
  # context. Approximate: ~4 characters per token.
  max_result_tokens: 5000
  # Classifies each user message against the skills (TypeSafe) and names the
  # relevant ones in the system prompt. Delete the section to turn it off.
  # Needs $TYPESAFE_API_KEY.
  skill_router:
    model: jev-1.13.0
    multi: false

data:
  # Resolved against the working directory. Format follows from the extension.
  path: ../data/youtube_trending_cleaned_us.csv

database:
  # The DSN carries a password, so it comes from $DATABASE_URL, not this file.
  # Stops a query from pulling a whole table into memory. Context size is
  # agent.max_result_tokens' job, not this one's.
  max_rows: 1000
  timeout: 10.0

sandbox:
  # none: no code execution. Otherwise a name in sandboxes.PROVIDERS;
  # daytona needs $DAYTONA_API_KEY. Provider settings go under `options:`.
  provider: daytona

  # Installed in every new sandbox. The agent analyses with polars and charts
  # with plotly (interactive HTML the frontend renders).
  packages:
    - pyarrow
    - polars
    - plotly

  # Paths inside the sandbox. Home directories differ between providers.
  data_dir: /home/daytona/data
  output_dir: /home/daytona/outputs

  export_max_rows: 100000

server:
  # Relative to backend/. reports/ and uploads/ are git-ignored.
  artifacts_dir: reports/artifacts
  uploads_dir: uploads
  # Each open conversation keeps a sandbox (billed) until idle this long.
  sandbox_idle_minutes: 15
  max_upload_mb: 50
